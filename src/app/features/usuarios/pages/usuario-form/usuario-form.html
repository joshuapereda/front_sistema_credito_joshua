
<app-page-header antetitulo="Usuarios" [titulo]="esEdicion() ? 'Editar usuario' : 'Nuevo usuario'">
  <a class="btn btn-secondary" routerLink="/usuarios">Volver</a>
</app-page-header>

<form [formGroup]="userForm">

  <label for="username">Ingrese Username</label>
  <input
    type="email"
    id="username"
    formControlName="username"
  >
  <br>

  <label for="personaId">Ingrese Persona</label>
  <input
    type="number"
    id="personaId"
    formControlName="personaId"
  >
  <br>

  <label for="rolesId">Seleccione Roles</label>
  <select
    id="rolesId"
    formControlName="rolesId"
    multiple
  >
    <option [value]="1">Administrador</option>
    <option [value]="2">Usuario</option>
    <option [value]="3">Supervisor</option>
  </select>
  <br>

  <label for="password">Ingrese Password</label>
  <input
    type="password"
    id="password"
    formControlName="password"
  >
  <br>

  <button type="button" (click)="funGuardarUsuario()">
    GUARDAR
  </button>

</form>
