<div class="flex min-h-screen items-center justify-center p-4">
  <form
    [formGroup]="loginForm"
    (ngSubmit)="funIngresar()"
    class="card flex w-full max-w-sm flex-col gap-4"
  >
    <h1 class="text-center text-xl font-semibold">Sistema de Crédito</h1>

    <div>
      <label class="label" for="username">Usuario</label>
      <input
        id="username"
        class="input"
        type="text"
        formControlName="username"
        autocomplete="username"
      />
    </div>

    <div>
      <label class="label" for="password">Contraseña</label>
      <input
        id="password"
        class="input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">Ingresar</button>
  </form>
</div>
