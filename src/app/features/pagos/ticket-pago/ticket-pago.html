<app-ticket>
  <p class="titulo">COMPROBANTE DE PAGO</p>
  <p class="numero">N° {{ pago.id }}</p>

  <div class="sep"></div>

  <p><b>Fecha:</b> {{ pago.fechaHora | date:'dd/MM/yyyy hh:mm a' }}</p>
  <p><b>Cliente:</b> {{ pago.nombreClienteCompra }}</p>
  <p><b>Compra:</b> #{{ pago.compraId }}</p>

  <div class="sep"></div>

  <div class="fila total">
    <span>PAGO RECIBIDO</span>
    <span>{{ pago.monto | currency:'PEN':'S/ ' }}</span>
  </div>
  <div class="fila debe">
    <span>SALDO RESTANTE</span>
    <span>{{ pago.saldoRestante | currency:'PEN':'S/ ' }}</span>
  </div>
</app-ticket>

<style>p { margin: 1px 0; }
.titulo { text-align: center; font-weight: 700; font-size: 13px; letter-spacing: 1px; }
.numero { text-align: center; font-size: 12px; }
.sep { border-top: 1px dashed #000; margin: 6px 0; }

table { width: 100%; border-collapse: collapse; font-size: 11px; }
th { border-bottom: 1px solid #000; padding: 2px 0; font-size: 10px; }
td { padding: 3px 0; vertical-align: top; }
.izq { text-align: left; }
.der { text-align: right; white-space: nowrap; }
.unit { font-size: 10px; color: #444; }

.fila { display: flex; justify-content: space-between; margin: 2px 0; }
.total { font-size: 15px; font-weight: 700; }
.debe { font-weight: 700; border-top: 1px dashed #000; padding-top: 4px; margin-top: 4px; }</style>
