<div class="min-h-screen flex flex-col">
  <header class="h-14 px-6 flex items-center bg-emerald-600 text-white shadow">
    <span class="font-semibold text-lg">Sistema de Crédito</span>
  </header>

  <div class="flex flex-1">
    <nav class="w-56 bg-white border-r border-gray-200 p-3">
      <ul class="flex flex-col gap-1">
        @for (item of menu; track item.ruta) {
          <li>
            <a
              [routerLink]="item.ruta"
              routerLinkActive="bg-emerald-50 text-emerald-700 font-semibold"
              class="block px-3 py-2 rounded-md text-gray-700 hover:bg-gray-100"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <main class="flex-1 p-6">
      <router-outlet />
    </main>
  </div>
</div>
