<div class="min-h-screen flex flex-col">
  <header class="h-14 px-6 flex items-center bg-primary text-primary-contrast shadow">
    <span class="font-semibold text-lg">Sistema de Crédito</span>
  </header>

  <div class="flex flex-1">
    <nav class="w-56 bg-surface-0 border-r border-surface-200 p-3">
      <ul class="list-none m-0 p-0 flex flex-col gap-1">
        @for (item of menu; track item.ruta) {
          <li>
            <a
              [routerLink]="item.ruta"
              routerLinkActive="bg-primary-50 text-primary font-semibold"
              class="flex items-center gap-2 px-3 py-2 rounded-md no-underline text-color hover:bg-surface-100"
            >
              <i [class]="item.icon"></i>
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <main class="flex-1 p-6">
      <router-outlet />
    </main>
  </div>
</div>
