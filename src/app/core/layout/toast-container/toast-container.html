<div
  class="pointer-events-none fixed inset-x-4 bottom-4 z-[60] flex flex-col items-end gap-2 sm:inset-x-auto sm:right-6 sm:bottom-6"
  aria-live="polite"
>
  @for (n of notificacionService.notificaciones(); track n.id) {
    <div
      role="status"
      class="rise pointer-events-auto flex w-full max-w-[380px] items-start gap-3 rounded-[8px] bg-ink py-3 pr-2 pl-4 text-paper shadow-[0_18px_40px_-12px_rgb(27_26_22/0.5)]"
    >
      <span class="mt-[7px] size-2 shrink-0 rounded-full" [class]="marca[n.tipo]"></span>
      <div class="min-w-0 flex-1">
        <p class="font-mono text-[10px] tracking-[0.14em] text-paper/50 uppercase">
          {{ etiqueta[n.tipo] }}
        </p>
        <p class="mt-0.5 text-[14px] leading-snug">{{ n.mensaje }}</p>
      </div>
      <button
        type="button"
        class="grid size-7 shrink-0 place-items-center rounded-[5px] text-paper/50 hover:bg-paper/10 hover:text-paper"
        aria-label="Cerrar"
        (click)="notificacionService.cerrar(n.id)"
      >
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path
            d="M2.5 2.5l7 7M9.5 2.5l-7 7"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
  }
</div>
