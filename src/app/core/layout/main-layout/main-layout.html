<div class="flex min-h-screen flex-col">
  <header class="flex h-14 items-center bg-emerald-600 px-6 text-white shadow">
    <a routerLink="/dashboard" class="text-lg font-semibold">Sistema de Crédito</a>
  </header>

  <div class="flex flex-1">
    <nav class="w-60 shrink-0 border-r border-gray-200 bg-white p-3">
      @for (grupo of menu; track grupo.titulo) {
        <p
          class="mt-4 mb-1 px-3 text-xs font-semibold tracking-wide text-gray-400 uppercase first:mt-0"
        >
          {{ grupo.titulo }}
        </p>
        <ul class="flex flex-col gap-0.5">
          @for (item of grupo.items; track item.ruta) {
            <li>
              <a
                [routerLink]="item.ruta"
                routerLinkActive="bg-emerald-50 text-emerald-700 font-semibold"
                class="block rounded-md px-3 py-2 text-sm text-gray-700 hover:bg-gray-100"
              >
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      }
    </nav>

    <main class="min-w-0 flex-1 p-6">
      <router-outlet />
    </main>
  </div>
</div>
